name: Publish verified Yablonsky Multilingual 2.53.7 source
on:
  push:
    branches: [main]
    paths:
      - '.github/source-payload/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ymulti2537-source-publication
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Verify source payload and extract 180 original files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path, PurePosixPath
          import tarfile, io, struct, sys

          payload_dir = Path('.github/source-payload')
          parts = sorted(payload_dir.glob('part_*.bin'))
          expected_names = [f'part_{i:03d}.bin' for i in range(16)]
          if [p.name for p in parts] != expected_names:
              sys.exit('FAIL: expected all 16 source payload parts in order')

          packed = b''.join(p.read_bytes() for p in parts)
          expected_sha = '9866c37c07c579f0dbf9c3bb54b1870e85ef85adca7437c77c23a71fe4cd7ed6'
          actual_sha = hashlib.sha256(packed).hexdigest()
          if actual_sha != expected_sha or len(packed) != 2048112:
              sys.exit('FAIL: source package checksum or size mismatch')

          files = {}
          with tarfile.open(fileobj=io.BytesIO(packed), mode='r:xz') as tar:
              for member in tar.getmembers():
                  if not member.isfile() or member.issym() or member.islnk():
                      sys.exit('FAIL: unsafe tar entry')
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] in ('.github',):
                      sys.exit('FAIL: disallowed path: ' + member.name)
                  if path.name.startswith('YMULTI_') and path.parts[0] == 'docs':
                      sys.exit('FAIL: private engineering note in public source')
                  if member.name in files:
                      sys.exit('FAIL: duplicate archive member')
                  files[member.name] = tar.extractfile(member).read()

          if len(files) != 180:
              sys.exit(f'FAIL: expected 180 public files, got {len(files)}')
          for ext, n in (('.php', 74), ('.js', 19), ('.css', 10), ('.po', 36), ('.mo', 36)):
              count = sum(path.endswith(ext) for path in files)
              if count != n:
                  sys.exit(f'FAIL: expected {n} {ext} files, got {count}')
          main = files['yablonsky-multilingual.php'].decode('utf-8')
          readme = files['readme.txt'].decode('utf-8')
          if 'Version: 2.53.7' not in main or 'Stable tag: 2.53.7' not in readme:
              sys.exit('FAIL: YMulti version mismatch')
          for path, data in files.items():
              if path.endswith('.mo'):
                  if len(data) < 32 or data[:4] != b'\xde\x12\x04\x95':
                      sys.exit(f'FAIL: malformed MO header: {path}')
                  if struct.unpack_from('<I', data, 24)[0] == 0:
                      sys.exit(f'FAIL: WordPress-incompatible MO index: {path}')

          for path, data in files.items():
              target = Path(path)
              if target.exists() and target.is_symlink():
                  sys.exit('FAIL: pre-existing symbolic link: ' + path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          print(f'PASS: 180 source files verified; source pack SHA-256 {actual_sha}')
          print('PASS: 74 PHP, 19 JS, 10 CSS, 36 PO, 36 MO; metadata and native MO headers')
          print('PASS: internal engineering documents excluded; public README and LICENSE preserved')
          PY

      - name: Verify PHP and JavaScript syntax
        run: |
          set -euo pipefail
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          find . -name '*.js' -print0 | xargs -0 -n1 node --check > /dev/null
          echo 'PASS: PHP and JavaScript syntax'

      - name: Commit verified public source without transfer parts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -f .github/source-payload
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed'
          else
            git commit -m 'release: publish verified YMulti 2.53.7 source and 36 locales'
            git push origin HEAD:main
          fi
