name: YMulti narrow WordPress.org candidate checks

on:
  pull_request:
    paths:
      - 'includes/class-ypm-migration-tools.php'
      - 'assets/admin-shell.css'
      - 'assets/release-2.53.7/admin-shell.css'
      - '.github/workflows/prepublic-ymulti-minimal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Lint all runtime PHP
        run: |
          set -euo pipefail
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l yablonsky-multilingual.php >/dev/null
          php -l uninstall.php >/dev/null
          echo "PASS: PHP syntax on ${{ matrix.php }}"

  migration-and-assets:
    name: Migration scope, CSS parity and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify narrowly authorized migration removal and layout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          migration=Path('includes/class-ypm-migration-tools.php').read_text(encoding='utf8')
          if re.search('fitoterra|fml_post_translations|_fml_order_lang|fml_strings|YMULTI_ENABLE_INTERNAL_FITOTERRA_MIGRATION',migration,re.I):
              raise SystemExit('FAIL: legacy Fitoterra runtime remains')
          for required in ("'wpml' =>", "'polylang' =>", 'process_wpml', 'process_polylang', "['wpml', 'polylang']"):
              if required not in migration:
                  raise SystemExit('FAIL: missing migration requirement '+required)
          if migration.count("['wpml', 'polylang']")<2:
              raise SystemExit('FAIL: no server-side source restriction')
          if "if (!in_array($source, ['wpml', 'polylang'], true))" not in migration:
              raise SystemExit('FAIL: import does not fail closed before side effects')
          a=Path('assets/admin-shell.css').read_bytes()
          b=Path('assets/release-2.53.7/admin-shell.css').read_bytes()
          if a!=b:
              raise SystemExit('FAIL: shipped active and canonical CSS differ')
          css=a.decode('utf8')
          required_css=[
              '.ypm-admin--migration .ypm-source-grid{grid-template-columns:repeat(2,minmax(0,1fr))',
              'margin-bottom:var(--ypm-space-4)',
              '.ypm-admin--migration .ypm-source-card{min-height:178px}',
              '@media(max-width:900px){.ypm-admin--migration .ypm-source-grid{grid-template-columns:minmax(0,1fr)}',
          ]
          for needle in required_css:
              if needle not in css:
                  raise SystemExit('FAIL: missing layout rule '+needle)
          print('PASS: no Fitoterra in migration PHP, WPML/Polylang retained, CSS copies identical')
          PY
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find assets blocks -type f -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          echo 'PASS: JavaScript syntax'

  wordpress-plugin-check:
    name: Official WordPress Plugin Check — accepted-source candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage accepted source and license only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          import hashlib,json
          manifest=json.loads(Path('.github/RELEASE_SOURCE_SHA256_2.53.7.json').read_text(encoding='utf8'))
          expected=manifest['files']
          if manifest['version']!='2.53.7' or len(expected)!=180:
              raise SystemExit('FAIL: baseline source inventory')
          for name,sha in expected.items():
              src=Path(name)
              if src.is_absolute() or '..' in src.parts or not src.is_file():
                  raise SystemExit('FAIL: unsafe/missing source '+name)
              if name not in ('includes/class-ypm-migration-tools.php','assets/admin-shell.css','assets/release-2.53.7/admin-shell.css'):
                  if hashlib.sha256(src.read_bytes()).hexdigest()!=sha:
                      raise SystemExit('FAIL: unrelated accepted runtime changed: '+name)
              dst=Path('.ci-stage/yablonsky-multilingual')/name
              dst.parent.mkdir(parents=True,exist_ok=True)
              copy2(src,dst)
          copy2('LICENSE','.ci-stage/yablonsky-multilingual/LICENSE')
          print('PASS: staged 180 runtime files with exactly three authorized changes')
          PY
      - name: Official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./.ci-stage/yablonsky-multilingual
          include-experimental: 'false'
